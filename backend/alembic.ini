# Миграции БД (Т3). На старте приложения db.init_db применяет их сама; руками нужно только создать новую:
#   cd backend; $env:PYTHONUTF8=1; .venv\Scripts\python -m alembic revision --autogenerate -m "что меняем"
# Автогенерацию сверять глазами: SQLite не умеет часть ALTER (render_as_batch включён), прод на Postgres.
[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s: %(message)s
